# Nombre de la aplicación
spring.application.name=vet-system

# Conexión a MySQL
# createDatabaseIfNotExist evita tener que crear la BD a mano la primera vez
spring.datasource.url=jdbc:mysql://localhost:3306/vet_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
# ddl-auto=update: Hibernate crea/actualiza las tablas a partir de las entidades.
# Sirve para desarrollo; en producción se usa una herramienta de migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del servidor
server.port=8080
